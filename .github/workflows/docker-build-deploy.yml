name: Docker Build Deploy

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

env:
  DOCKERHUB_IMAGE: carlomt/apptainer
  DEBIAN_IMAGE: debian:bookworm-slim
  GO_VERSION: "1.23.5"

jobs:
  docker_build:
    name: Build Apptainer Docker image ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set build variables
        shell: bash
        run: |
          set -euo pipefail

          APPTAINER_VERSION="${GITHUB_REF_NAME#v}"

          if [[ -z "${APPTAINER_VERSION}" || "${APPTAINER_VERSION}" == "${GITHUB_REF_NAME}" ]]; then
            echo "This workflow expects tags like v1.5.1" >&2
            exit 1
          fi

          repo_lower="$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"

          echo "APPTAINER_VERSION=${APPTAINER_VERSION}" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
          echo "GHCR_IMAGE=ghcr.io/${repo_lower}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push GHCR image by digest
        id: build_ghcr
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.GHCR_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            APPTAINER_VERSION=${{ env.APPTAINER_VERSION }}
            BUILD_DATE=${{ env.BUILD_DATE }}
            TARGETARCH=${{ matrix.arch }}
            DEBIAN_IMAGE=${{ env.DEBIAN_IMAGE }}
            GO_VERSION=${{ env.GO_VERSION }}
          cache-from: type=gha,scope=apptainer-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=apptainer-${{ matrix.arch }}

      - name: Build and push Docker Hub image by digest
        id: build_dockerhub
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.DOCKERHUB_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            APPTAINER_VERSION=${{ env.APPTAINER_VERSION }}
            BUILD_DATE=${{ env.BUILD_DATE }}
            TARGETARCH=${{ matrix.arch }}
            DEBIAN_IMAGE=${{ env.DEBIAN_IMAGE }}
            GO_VERSION=${{ env.GO_VERSION }}
          cache-from: type=gha,scope=apptainer-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=apptainer-dockerhub-${{ matrix.arch }}

      - name: Export GHCR digest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests/ghcr
          digest="${{ steps.build_ghcr.outputs.digest }}"
          touch "/tmp/digests/ghcr/${digest#sha256:}"

      - name: Export Docker Hub digest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests/dockerhub
          digest="${{ steps.build_dockerhub.outputs.digest }}"
          touch "/tmp/digests/dockerhub/${digest#sha256:}"

      - name: Upload GHCR digest artifact
        uses: actions/upload-artifact@v7
        with:
          name: digests-ghcr-${{ matrix.arch }}
          path: /tmp/digests/ghcr/*
          if-no-files-found: error
          retention-days: 1

      - name: Upload Docker Hub digest artifact
        uses: actions/upload-artifact@v7
        with:
          name: digests-dockerhub-${{ matrix.arch }}
          path: /tmp/digests/dockerhub/*
          if-no-files-found: error
          retention-days: 1

  docker_manifest:
    name: Create multiarch manifests
    needs: docker_build
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Set manifest variables
        shell: bash
        run: |
          set -euo pipefail

          repo_lower="$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"

          echo "GHCR_IMAGE=ghcr.io/${repo_lower}" >> "$GITHUB_ENV"
          echo "APPTAINER_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Download GHCR digests
        uses: actions/download-artifact@v7
        with:
          path: /tmp/digests/ghcr
          pattern: digests-ghcr-*
          merge-multiple: true

      - name: Download Docker Hub digests
        uses: actions/download-artifact@v7
        with:
          path: /tmp/digests/dockerhub
          pattern: digests-dockerhub-*
          merge-multiple: true

      - name: Create and push GHCR multiarch manifest
        shell: bash
        run: |
          set -euo pipefail

          refs=()
          for digest_file in /tmp/digests/ghcr/*; do
            [ -e "$digest_file" ] || continue
            digest="$(basename "$digest_file")"
            refs+=("${GHCR_IMAGE}@sha256:${digest}")
          done

          if [ "${#refs[@]}" -eq 0 ]; then
            echo "No GHCR digests found" >&2
            exit 1
          fi

          docker buildx imagetools create \
            -t "${GHCR_IMAGE}:${APPTAINER_VERSION}" \
            -t "${GHCR_IMAGE}:latest" \
            "${refs[@]}"

      - name: Create and push Docker Hub multiarch manifest
        shell: bash
        run: |
          set -euo pipefail

          refs=()
          for digest_file in /tmp/digests/dockerhub/*; do
            [ -e "$digest_file" ] || continue
            digest="$(basename "$digest_file")"
            refs+=("${DOCKERHUB_IMAGE}@sha256:${digest}")
          done

          if [ "${#refs[@]}" -eq 0 ]; then
            echo "No Docker Hub digests found" >&2
            exit 1
          fi

          docker buildx imagetools create \
            -t "${DOCKERHUB_IMAGE}:${APPTAINER_VERSION}" \
            -t "${DOCKERHUB_IMAGE}:latest" \
            "${refs[@]}"

      - name: Inspect GHCR image
        run: |
          docker buildx imagetools inspect "${GHCR_IMAGE}:${APPTAINER_VERSION}"

      - name: Inspect Docker Hub image
        run: |
          docker buildx imagetools inspect "${DOCKERHUB_IMAGE}:${APPTAINER_VERSION}"
